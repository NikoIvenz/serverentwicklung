[project]
name = "auto"
version = "2026.10.1"
description = "Prüfungsprojekt Auto mit FastAPI, PostgreSQL, Pydantic und uv"
readme = "README.md"
authors = [
    { name = "Dein Name", email = "deine.email@h-ka.de" },
]
requires-python = ">=3.13"
license = "GPL-3.0-or-later"

dependencies = [
    "anyio>=4.15.1,<5.0.0",
    "cffi>=2.1.1,<3.0.0",
    "cryptography>=44.0.0,<50.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "orjson>=3.12.0,<4.0.0",
    "psycopg[binary,pool]>=3.2.3,<4.0.0",
    "pydantic[email]>=2.10.0,<3.0.0",
    "pydantic_core>=2.46.5,<3.0.0",
    "pyfiglet>=1.0.4,<2.0.0",
    "pyinstrument>=5.1.3,<6.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "python-multipart>=v0.0.32,<1.0.0",
    "PyYAML>=6.0.3,<7.0.0",
    "requests>=2.34.2,<3.0.0",
    "SQLAlchemy>=2.0.36,<3.0.0",
    "starlette>=0.40.0,<2.0.0",
    "tabulate>=0.10.0,<1.0.0",
    "urllib3>=2.8.0,<3.0.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[project.scripts]
auto = "auto:main"

[build-system]
requires = ["uv_build>=0.12.20,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httptools>=0.7.1,<1.0.0",
    "pygments>=2.20.0,<3.0.0",
    "pytest>=8.3.4,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-env>=1.7.1,<2.0.0",
    "pytest-html>=4.2.0,<5.0.0",
    "pytest-mock>=3.16.0,<4.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "httpx>=0.28.1",
]
lint = [
    "ruff>=0.9.1,<1.0.0",
    "types-openpyxl>=3.1.5,<4.0.0",
    "types-tabulate>=0.10.0,<1.0.0",
    "yamllint>=1.38.0,<2.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0.0"
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--html=report.html --cov --cov-report=html"
markers = [
    "rest: REST-Schnittstelle",
    "get_request: GET-Requests",
    "post_request: POST-Requests",
    "put_request: PUT-Requests",
    "delete_request: DELETE-REQUESTS",
    "unit",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
select = [
    "YTT", "ASYNC", "S", "BLE", "B", "C4", "DTZ", "T10", "EXE", "FA", "INT", 
    "ISC", "LOG", "G", "PIE", "PYI", "PT", "RET", "SIM", "TC", "PTH", "FLY", 
    "I", "N", "PERF", "E", "W", "D", "F", "PGH", "PL", "UP", "FURB", "RUF", 
    "TRY", "FAST", "FBT", "A", "COM", "RSE", "SLF", "TID", "ARG"
]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    "no-self-use",
    "unspecified-encoding",
]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert", "undocumented-public-function"]

[tool.ruff.lint.pylint]
max-statements-in-try = 7

[tool.uv]
required-version = ">= 0.12.20"
default-groups = "all"

[tool.uv.pip]
exclude-newer = "1 day"
all-extras = true
