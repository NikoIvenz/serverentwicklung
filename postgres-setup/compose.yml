services:
  postgres:
    image: postgres:18
    ports:
      - published: 5432
        target: 5432
    command:
      [
        "--ssl=on",
        "--ssl-cert-file=/var/lib/postgresql/18/docker/server.crt",
        "--ssl-key-file=/var/lib/postgresql/18/docker/server.key",
      ]
    volumes:
      - pg_data:/var/lib/postgresql/
      - pg_tablespace:/tablespace
      - pg_init:/init:ro
    environment:
      TZ: Europe/Berlin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    secrets: [db_password]
    networks: [acme-network]
    user: "postgres:postgres"
    hostname: postgres
    container_name: postgres
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, pg_isready, --dbname=postgres, --username=postgres]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 5s
    restart: unless-stopped

secrets:
  db_password:
    file: ./password.txt

volumes:
  pg_data:
    name: pg_data
    external: true
  pg_tablespace:
    name: pg_tablespace
    external: true
  pg_init:
    name: pg_init
    external: true

networks:
  acme-network:
    name: acme-network
